[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot-pydantic-v1-fixture"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic==1.10.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 88
target-version = "py310"
